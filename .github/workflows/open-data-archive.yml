# Daily open-data archive.
#
# Two sources keep only a rolling window, so this job stores every complete
# day not yet archived and commits the result (both commands are idempotent
# and catch up on missed days):
#   - IESO Intertie Schedule and Flow (~3 months kept) -> data/ieso/*.csv
#   - ECCC SWOB minute observations at Ottawa CDA RCS (~30 days kept)
#     -> data/obs/swob/CXOA/<day>.parquet
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.
name: Daily open-data archive

on:
  schedule:
    - cron: "17 9 * * *" # 04:17 EST, after IESO finalizes the previous day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-data-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Fetch new IESO days
        run: uv run --frozen dlr fetch-ieso

      - name: Fetch new SWOB minute days (CXOA)
        run: uv run --frozen dlr fetch-swob

      - name: Commit archive
        run: |
          git config user.name "p-brunet"
          git config user.email "60510951+p-brunet@users.noreply.github.com"
          git add data/ieso data/obs
          if git diff --cached --quiet; then
            echo "no new days"
          else
            git commit -m "Open-data archive: $(date -u +%F)"
            git push
          fi
