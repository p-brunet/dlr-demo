# Study area, a short test period and paths.
# bbox covers the A41T/A42T corridor (Hawthorne TS <-> Poste de l'Outaouais,
# 45.39N-45.60N) with a margin, and reaches south-west to the two verification
# stations (Ottawa Intl A, 45.317N -75.667W; Ottawa Gatineau A, 45.522N
# -75.564W). It fits in a single native HRDPS spatial chunk.
# period is only used by `dlr fetch --no-dry-run --period-only` for a quick
# local test; the pipeline itself uses every HRDPS run since 2026-07-09.
period:
  start: "2026-09-15"
  end: "2026-09-18"
bbox:
  min_lon: -75.70
  min_lat: 45.30
  max_lon: -75.35
  max_lat: 45.65
weather:
  source: hrdps
paths:
  data_dir: data
  cache_dir: .cache
  output_dir: output
