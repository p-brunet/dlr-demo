notes: 'Corrected during Milestone 1 execution: initial tag-based cross-validation
  (D5A/H9A refs matching IESO zone names) pointed at Poste Vignan (~4km from Hawthorne
  TS) as the QC endpoint, but direct geometry tracing of the ref-tagged OSM ways showed
  the corridor actually runs ~17km northeast to Poste Masson / Poste de l''Interconnexion-Maclaren
  near Masson-Angers/Thurso, QC. The A41T/A42T circuits (also Hydro One, 230kV) run
  in the same corridor and likely share the same right-of-way but are not included
  in this geometry (kept as a documented parallel circuit, not this candidate''s primary
  pair). D5A (230kV) and H9A (115kV) are combined on many way segments but mapped
  as separate parallel ways for part of the corridor; the stored geometry/length uses
  only D5A-bearing ways (primary_ref) to avoid double-counting the shared right-of-way
  -- see docs/DATA_SOURCES.md for the length comparison.'
