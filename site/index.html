<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Rating Explorer</title>
<meta name="description" content="Sensorless dynamic line rating of the A41T/A42T Ontario–Québec tie from open weather, terrain and line data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 14 L8 2 L14 14 M5 9 H11' stroke='%232a78d6' stroke-width='1.8' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeeea;
  --border: #e0dfda;
  --grid: #e4e3df;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --accent: #2a78d6;
  --series-dlr: #2a78d6;
  --series-aar: #eb6834;
  --series-secure: #1baf7a;
  --series-flow: #6250d6;
  --series-span: #e87ba4;
  --static: #52514e;
  --marker: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #33332f;
    --grid: #2c2c29;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #94938b;
    --accent: #3987e5;
    --series-dlr: #3987e5;
    --series-aar: #d95926;
    --series-secure: #199e70;
    --series-flow: #9085e9;
    --series-span: #d55181;
    --static: #c3c2b7;
    --marker: #f0efec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #242422;
  --border: #33332f;
  --grid: #2c2c29;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #94938b;
  --accent: #3987e5;
  --series-dlr: #3987e5;
  --series-aar: #d95926;
  --series-secure: #199e70;
  --series-flow: #9085e9;
  --series-span: #d55181;
  --static: #c3c2b7;
  --marker: #f0efec;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface-0);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header { padding: 14px 20px 10px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
header h1 { margin: 0; font-size: 18px; font-weight: 650; }
header p { margin: 2px 0 0; color: var(--text-secondary); font-size: 13px; }
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 62px); }
aside { overflow-y: auto; background: var(--surface-1); border-right: 1px solid var(--border); padding: 14px 16px 24px; }
main { display: grid; grid-template-rows: minmax(260px, 1fr) auto; min-width: 0; }
#map { min-height: 260px; }
.chapters { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.chapter {
  text-align: left; border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-primary); border-radius: 8px; padding: 9px 11px; cursor: pointer; font: inherit;
}
.chapter:hover { background: var(--surface-2); }
.chapter[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.chapter b { display: block; font-weight: 600; }
.chapter span { color: var(--text-secondary); font-size: 12.5px; }
#story { font-size: 13.5px; color: var(--text-primary); border-top: 1px solid var(--border); padding-top: 12px; }
#story p { margin: 0 0 8px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.kpi { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.kpi .label { color: var(--text-secondary); font-size: 12px; }
.kpi .value { font-size: 20px; font-weight: 600; }
.controls { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--surface-1); border-top: 1px solid var(--border); flex-wrap: wrap; }
.controls button, .seg button {
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px;
}
.controls button:hover, .seg button:hover { background: var(--surface-2); }
#windToggle[aria-pressed="true"] { background: var(--surface-2); font-weight: 600; }
.seg { display: inline-flex; gap: 0; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--surface-2); font-weight: 600; }
#hour { flex: 1 1 220px; accent-color: var(--accent); }
#when { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 13px; min-width: 260px; }
.chart-wrap { background: var(--surface-1); padding: 6px 14px 10px; position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-secondary); margin: 2px 0 4px; }
.legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.legend button[aria-pressed="false"] { opacity: 0.4; }
.key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
#chart { width: 100%; height: 200px; display: block; }
#chart text { fill: var(--text-muted); font-size: 11px; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.12); display: none; white-space: nowrap; z-index: 5;
}
.tip .row { display: flex; align-items: center; gap: 6px; }
.maplegend {
  position: absolute; left: 10px; bottom: 28px; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; z-index: 2; min-width: 190px;
}
.maplegend .bar { height: 8px; border-radius: 4px; margin: 6px 0 2px; }
.maplegend .ticks { display: flex; justify-content: space-between; color: var(--text-secondary); }
.mapwrap { position: relative; }
.windcanvas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.windbox {
  position: absolute; left: 10px; top: 10px; z-index: 2; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px;
}
.windbox .muted { color: var(--text-secondary); }
.maplibregl-popup-content { background: var(--surface-1); color: var(--text-primary); font: 12.5px/1.4 system-ui, sans-serif; }
.maplibregl-popup-tip { display: none; }
footer { font-size: 11.5px; color: var(--text-muted); padding: 10px 0 0; }
footer a { color: var(--text-secondary); }
.table-link { font-size: 12px; color: var(--text-secondary); }
.viewseg { display: flex; margin-bottom: 12px; }
.viewseg button { flex: 1; padding: 7px 10px; font-size: 13.5px; }
.issued { font-size: 12.5px; color: var(--text-secondary); }
.notice { border-left: 3px solid #fab219; background: var(--surface-2); padding: 6px 10px; border-radius: 4px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
  main { grid-template-rows: 380px auto; }
  #when { min-width: 0; flex-basis: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>How much more could this line carry?</h1>
  <p>Weather-based (dynamic) rating forecast for the A41T/A42T 230 kV tie, Hawthorne TS (ON) ↔ Poste de l'Outaouais (QC), from open data only — updated with every new Environment Canada weather run.</p>
</header>
<div class="layout">
  <aside>
    <div class="seg viewseg" role="group" aria-label="View">
      <button data-view="forecast" aria-pressed="true">Forecast · next 48 h</button>
      <button data-view="history" aria-pressed="false">History &amp; story</button>
    </div>
    <div class="chapters" id="chapters"></div>
    <div id="story"></div>
    <footer id="credits"></footer>
  </aside>
  <main>
    <div class="mapwrap">
      <div id="map" style="height:100%"></div>
      <canvas id="wind" class="windcanvas" aria-hidden="true"></canvas>
      <div class="windbox" id="windbox"></div>
      <div class="maplegend" id="maplegend"></div>
    </div>
    <div>
      <div class="controls">
        <button id="play" aria-label="Play">▶ Play</button>
        <input id="hour" type="range" min="0" max="0" value="0" aria-label="Hour">
        <span id="when"></span>
        <span class="seg" role="group" aria-label="Map colour">
          <button data-mode="ratio" aria-pressed="true">Rating ÷ static</button>
          <button data-mode="exposure" aria-pressed="false">Exposure</button>
          <button data-mode="limiting" aria-pressed="false">Weakest span</button>
        </span>
        <button id="windToggle" aria-pressed="true" title="Animated 10 m wind (HRDPS) for the selected hour">≋ Wind</button>
        <span class="seg" role="group" aria-label="Chart window" id="windowSeg">
          <button data-window="7" aria-pressed="true">7 days</button>
          <button data-window="all" aria-pressed="false">All</button>
        </span>
      </div>
      <div class="chart-wrap">
        <div class="legend" id="legend"></div>
        <svg id="chart" role="img" aria-label="Line rating over time"></svg>
        <div class="tip" id="tip"></div>
        <a class="table-link" href="data/line_ratings_hourly.parquet">Download the hourly table (Parquet)</a>
      </div>
    </div>
  </main>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmtUTC = new Intl.DateTimeFormat("en-CA", { timeZone: "UTC", dateStyle: "medium", timeStyle: "short" });
const fmtLocal = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const fmtLocalLong = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", weekday: "short", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const fmtLocalDate = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const RATIO_STOPS = [[0.7, "#a62a2a"], [0.85, "#e66767"], [1.0, "#9a9993"], [1.15, "#3987e5"], [1.35, "#104281"]];
const BLUE_STOPS = (lo, hi) => [[lo, "#86b6ef"], [(lo + hi) / 2, "#2a78d6"], [hi, "#0d366b"]];
const SUMMER_MONTHS = [5, 6, 7, 8, 9, 10];
const STALE_HOURS = 18;

const state = { view: "forecast", hour: 0, mode: "ratio", window: "7", span: null, playing: null, wind: true, histHour: 0 };
let HIST = null, FC = null, D = null, M, spans, nSpans, map;

const getJSON = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u); return r.json(); });
const getBin = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u); return r.arrayBuffer(); });
const optional = (p) => p.catch(() => null);

Promise.all([
  getJSON("data/line_hourly.json"), getJSON("data/manifest.json"), getJSON("data/spans.geojson"),
  getBin("data/span_ratio.bin"), getJSON("data/wind_grid.json"), getBin("data/wind_grid.bin"), getBin("data/span_wind.bin"),
  optional(getJSON("data/forecast/forecast.json")), optional(getBin("data/forecast/span_ratio.bin")),
  optional(getBin("data/forecast/wind_grid.bin")), optional(getBin("data/forecast/span_wind.bin")),
]).then(([hourly, manifest, spanGeo, ratioBuf, wg, wgBuf, swBuf, fc, fcRatio, fcWind, fcSpanWind]) => {
  M = manifest; spans = spanGeo; nSpans = spans.features.length;
  spans.features.forEach((f, i) => { f.id = i; });
  HIST = withTimes({ ...hourly, kind: "history", ratio: new Uint16Array(ratioBuf), spanWind: new Uint8Array(swBuf), windGrid: new Int8Array(wgBuf), grid: wg });
  HIST.testStartIdx = HIST.times.findIndex((t) => t >= new Date(HIST.test_start + "T00:00:00Z"));
  const ratios = HIST.dlr_mw.map((v, i) => (v == null ? NaN : v / HIST.static_mw[i]));
  HIST.minIdx = argExt(ratios, (a, b) => a < b);
  HIST.maxIdx = argExt(ratios, (a, b) => a > b);
  HIST.peakFlowIdx = argExt(HIST.flow_per_circuit_mw || [], (a, b) => a > b);
  if (fc && fcRatio && fcWind && fcSpanWind) {
    FC = withTimes({ ...fc, kind: "forecast", ratio: new Uint16Array(fcRatio), spanWind: new Uint8Array(fcSpanWind), windGrid: new Int8Array(fcWind), grid: fc.grid });
    FC.init = new Date(fc.init_utc);
    const now = new Date();
    const k = FC.times.findIndex((t) => t >= now);
    FC.nowIdx = k < 0 ? FC.n - 1 : Math.max(0, k);
    FC.expired = k < 0;
  }
  buildChapters(); buildCredits(); initMap();
});

function withTimes(ds) {
  ds.times = Array.from({ length: ds.n }, (_, i) => new Date(Date.parse(ds.t0) + i * 3600e3));
  return ds;
}
function argExt(arr, better) {
  let best = -1;
  arr.forEach((v, i) => { if (v != null && !Number.isNaN(v) && (best < 0 || better(v, arr[best]))) best = i; });
  return Math.max(best, 0);
}
const pct = (x) => `${x > 0 ? "+" : ""}${Math.round(x * 100)} %`;
const isSummer = (t) => SUMMER_MONTHS.includes(t.getUTCMonth() + 1);
const spanStaticA = (p, t) => (isSummer(t) ? p.static_a : p.static_winter_a);
const toMW = (amps) => (amps * Math.sqrt(3) * M.line.voltage_kv) / 1000;
function ago(date) {
  const h = (Date.now() - date) / 3600e3;
  return h < 1 ? `${Math.round(h * 60)} min ago` : `${Math.round(h)} h ago`;
}

/* ---------- views ---------- */
function activate(view, hour) {
  if (view === "forecast" && !FC) view = "history";
  if (state.view === "history" && D) state.histHour = state.hour;
  state.view = view;
  D = view === "forecast" ? FC : HIST;
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  document.getElementById("chapters").style.display = view === "history" ? "" : "none";
  document.getElementById("windowSeg").style.display = view === "history" ? "" : "none";
  document.getElementById("hour").max = D.n - 1;
  document.querySelector(".table-link").style.display = view === "history" ? "" : "none";
  state.span = null;
  buildLegend();
  if (view === "forecast") {
    renderForecastStory();
    setMode("ratio");
    setHour(hour ?? FC.nowIdx);
    if (map) fitLine();
  } else {
    setHour(hour ?? state.histHour);
  }
}
document.querySelectorAll("[data-view]").forEach((b) => (b.onclick = () => {
  if (b.dataset.view === "history") { activate("history"); showChapter(0); } else activate("forecast");
}));

function renderForecastStory() {
  const el = document.getElementById("story");
  const stale = (Date.now() - FC.init) / 3600e3 > STALE_HOURS;
  const ahead = [];
  for (let i = FC.nowIdx; i < FC.n; i++) ahead.push(i);
  const next24 = ahead.filter((i) => i < FC.nowIdx + 24);
  const minIdx = next24.reduce((b, i) => (FC.secure_mw[i] != null && (b < 0 || FC.secure_mw[i] < FC.secure_mw[b]) ? i : b), -1);
  const below = ahead.filter((i) => FC.secure_mw[i] != null && FC.secure_mw[i] < FC.static_mw[i]).length;
  const now = FC.nowIdx, m = FC.margin.filter((v) => v != null);
  const ratioNow = FC.secure_mw[now] / FC.static_mw[now];
  el.innerHTML = `
    <p class="issued">Forecast from the Environment Canada HRDPS run of <b>${fmtUTC.format(FC.init)} UTC</b> (${fmtLocalDate.format(FC.init)}),
      published here ${ago(new Date(FC.generated_utc))}. A new run arrives about every 6 hours.</p>
    ${FC.expired ? `<p class="notice">⚠ This forecast has run out: no newer weather run has been published yet.</p>`
      : stale ? `<p class="notice">⚠ Older than usual: the weather feed may be delayed.</p>` : ""}
    ${kpis([
      ["Secure rating now", `${FC.secure_mw[now] ?? "n/a"} MW`],
      ["vs static", Number.isFinite(ratioNow) ? `${ratioNow.toFixed(2)} ×` : "n/a"],
      ["Lowest, next 24 h", minIdx < 0 ? "n/a" : `${FC.secure_mw[minIdx]} MW`],
      ["Hours below static ahead", `${below} of ${ahead.length}`],
    ])}
    ${minIdx < 0 ? "" : `<p>The tightest hour in the next day is <b>${fmtLocalLong.format(FC.times[minIdx])}</b>
      (${(FC.secure_mw[minIdx] / FC.static_mw[minIdx]).toFixed(2)} × static).</p>`}
    <p><span style="color:var(--series-dlr)">Forecast DLR</span> is the expected rating of the weakest span from the
      forecast weather; <span style="color:var(--series-secure)">secure DLR</span> subtracts a safety margin
      (${Math.round(100 * Math.min(...m))}–${Math.round(100 * Math.max(...m))} %, growing with lead time) so it should be
      exceeded by the real rating in only ${Math.round(100 * (1 - FC.confidence))} % of hours.
      The margins are refit daily on ${FC.margins_n_pairs.toLocaleString("en-CA")} verified forecast hours
      (last fit ${FC.margins_fitted_on}).</p>
    <p>Drag the slider or press Play to step through the next ${FC.n} hours; hover a span for its forecast wind and
      its angle to the wire. Switch to <b>History &amp; story</b> to see how the method performed since July.</p>`;
}

function chapters() {
  const H = HIST, r = M.ratings, v = M.verification, base = v.variants.base;
  return [
    { title: "The line", sub: "A 34 km tie under converter-limited flow", mode: "ratio", hour: H.peakFlowIdx,
      html: `<p>A41T/A42T carries the Ontario–Québec HVDC tie (two 230 kV circuits, ${M.line.towers} towers, ${M.line.spans} spans) to Hydro-Québec's 1,250 MW Outaouais converter. Over the period the tie ran above 1,200 MW for long stretches.</p>
             <p>With both circuits in service the <b>converter</b>, not the line, caps the transfer. Thermal headroom matters when one circuit is out.</p>
             ${kpis([["Static rating / circuit (summer)", `${r.static_line_mw_per_circuit} MW`], ["Spans", M.line.spans]])}` },
    { title: "Where wind reaches the wires", sub: "Terrain sheltering from LiDAR", mode: "exposure", hour: null,
      html: `<p>Trees and buildings 20–60 m from each span, measured in NRCan's 1 m LiDAR elevation models, shelter the conductors. Darker spans are more exposed (open fields, the river crossing).</p>` },
    { title: "The weakest span keeps moving", sub: `${r.spans_ever_limiting} of ${M.line.spans} spans limit the line at some hour`, mode: "limiting", hour: null,
      html: `<p>A line is only as strong as its weakest span. Because the spans point in every direction, a wind that cools most of the line runs <i>along</i> a few spans and barely cools them.</p>
             <p>${r.spans_ever_limiting} different spans are the bottleneck at some hour. Wind angle explains ${Math.round(100 * (r.dlr_below_static.dominant_driver_share.wind_angle || 0))} % of the hours when the weather-based rating falls below static.</p>
             <p>Switch on <b>≋ Wind</b> to see the flow, and hover a span for the wind's angle to its wire.</p>` },
    { title: "The worst hour", sub: "Calm, hot, sun on the wires", mode: "ratio", hour: H.minIdx,
      html: `<p>At this hour the weather-based rating falls to <b>${pct(H.dlr_mw[H.minIdx] / H.static_mw[H.minIdx] - 1)}</b> versus the static rating, which assumes a steady 4 km/h crosswind on every span.</p>
             ${kpis([["Below static", `${Math.round(100 * r.dlr_below_static.share_of_hours)} % of hours`], ["Median gain", pct(r.dlr_over_static.median - 1)]])}` },
    { title: "The best hour", sub: "Cool and windy", mode: "ratio", hour: H.maxIdx,
      html: `<p>When it is cool and windy the same conductors could carry <b>${pct(H.dlr_mw[H.maxIdx] / H.static_mw[H.maxIdx] - 1)}</b> more than their static rating.</p>
             <p>How far to trust the hourly wind direction is the biggest modelling choice. Minute-by-minute wind at Ottawa's Experimental Farm shows the direction swings within each hour, which cools the wire like a ~9° minimum angle of attack: the median gain moves from ${pct(r.dlr_over_static.median - 1)} to ${pct(r.sensitivity.min_attack_angle_9deg.dlr_over_static_median - 1)} (a 20° floor would give ${pct(r.sensitivity.min_attack_angle_20deg.dlr_over_static_median - 1)}).</p>` },
    { title: "A day ahead, with a safety margin", sub: "Forecast skill and the 98 % secure rating", mode: "ratio", hour: Math.min(H.n - 1, H.testStartIdx + 24 * 10),
      html: `<p>HRDPS forecasts the rating within ${Math.round(100 * base.rating_mae_rel_by_lead[24])} % at 24 h (vs. ${Math.round(100 * base.rating_mae_rel_by_lead[7])} % at 7 h). A ${Math.round(100 * base.margin_by_lead[24])} % margin keeps the day-ahead <span style="color:var(--series-secure)">secure rating</span> above the truth in only ${(100 * base.test.secure_exceeds_truth_share).toFixed(1)} % of test hours.</p>
             <p>Checked against minute-by-minute wind at a real station, a virtual copy of the line needs a similar margin (about 16 %).</p>
             ${kpis([["Static above truth", `${Math.round(100 * base.test.static_exceeds_truth_share)} % of hours`], ["Secure above truth", `${(100 * base.test.secure_exceeds_truth_share).toFixed(1)} %`]])}` },
  ];
}
function kpis(items) {
  return `<div class="kpis">${items.map(([l, v]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("")}</div>`;
}
function buildChapters() {
  const box = document.getElementById("chapters");
  const list = chapters();
  list.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "chapter"; b.innerHTML = `<b>${i + 1}. ${c.title}</b><span>${c.sub}</span>`;
    b.onclick = () => showChapter(i);
    box.appendChild(b);
  });
  box._list = list;
}
function showChapter(i) {
  if (state.view !== "history") activate("history");
  const list = document.getElementById("chapters")._list;

/* ---------- wind ---------- */
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const COMPASS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const compass = (deg) => COMPASS[Math.round(deg / 22.5) % 16];

  // bilinear u/v (m/s, east/north) on the regular grid, for the selected hour

  if (fx < 0 || fy < 0 || fx > G.nx - 1 || fy > G.ny - 1) return null;
  const i0 = Math.min(Math.floor(fx), G.nx - 2), j0 = Math.min(Math.floor(fy), G.ny - 2);
  const wx = fx - i0, wy = fy - j0, base = state.hour * G.nx * G.ny;

  const lerp = (c) => (at(j0, i0, c) * (1 - wx) + at(j0, i0 + 1, c) * wx) * (1 - wy)

  const G = D.grid;
  let su = 0, sv = 0, ss = 0;
  const base = state.hour * G.nx * G.ny, n = G.nx * G.ny;
  for (let k = 0; k < n; k++) {
    const u = D.windGrid[(base + k) * 2] * G.scale_ms, v = D.windGrid[(base + k) * 2 + 1] * G.scale_ms;
    su += u; sv += v; ss += Math.hypot(u, v);

  const d = fromDirection(su, sv);
  box.innerHTML = `<b>Wind ${(ss / n).toFixed(1)} m/s</b> from ${compass(d)} (${Math.round(d)}°)`

}

const wctx = windCanvas.getContext("2d");

function spawn(p) {

    const rows = [["--static", "Static", D.static_mw[i]], ...active.map((s) => [s.color, s.label, s.data[i]])]
      .map(([c, l, v]) => `<div class="row"><span class="key" style="background:${css(c)}"></span>${l}: <b>${v == null ? "n/a" : Math.round(v) + " MW"}</b></div>`).join("");
    const lead = state.view === "forecast" ? ` · +${FC.lead_h[i]} h` : "";
    tip.innerHTML = `<div>${fmtUTC.format(D.times[i])} UTC (${fmtLocal.format(D.times[i])})${lead}</div>${rows}`;
    tip.style.display = "block";
    const wrap = svg.parentElement.getBoundingClientRect(), r = svg.getBoundingClientRect();
    const left = r.left - wrap.left + (x(i) / W) * r.width + 12;
    tip.style.left = `${Math.min(left, wrap.width - tip.offsetWidth - 8)}px`;
    tip.style.top = `${r.top - wrap.top + 6}px`;
  };
  hit.onmouseleave = () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  hit.onclick = (ev) => setHour(Math.max(i0, Math.min(i1, idxAt(ev))));
}
window.addEventListener("resize", () => drawChart());
</script>
</body>
